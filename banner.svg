
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 360"
     width="1200" height="360"
     role="img"
     aria-label="Alejandro López - Desarrollador Backend Junior">

<defs>
  <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1020"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>

  <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset=".55" stop-color="#4ade80"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>

  <pattern id="cuadricula" width="32" height="32"
           patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none"
          stroke="#22d3ee" stroke-opacity=".06"/>
  </pattern>

  <radialGradient id="brillo">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="brillo2">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>

  <clipPath id="tarjeta">
    <rect width="1200" height="360" rx="18"/>
  </clipPath>
</defs>

<style>
  .mono {
    font-family: Consolas, 'Liberation Mono', monospace;
  }

  .sans {
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .aparicion {
    animation: aparecer .9s ease backwards;
  }

  .retraso1 { animation-delay: .2s; }
  .retraso2 { animation-delay: .7s; }
  .retraso3 { animation-delay: 1.2s; }
  .retraso4 { animation-delay: 1.6s; }
  .retraso5 { animation-delay: 1.9s; }

  @keyframes aparecer {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  .cursor {
    animation: parpadear 1.1s steps(1) infinite;
  }

  @keyframes parpadear {
    50% { opacity: 0; }
  }

  .flotar {
    animation: flotar 6s ease-in-out infinite;
  }

  .flotar2 {
    animation: flotar 7.5s ease-in-out infinite reverse;
  }

  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .barrido {
    animation: barrer 4s linear infinite;
  }

  @keyframes barrer {
    from { transform: translateX(-300px); }
    to { transform: translateX(1200px); }
  }
</style>

<g clip-path="url(#tarjeta)">

  <rect width="1200" height="360" fill="url(#fondo)"/>
  <rect width="1200" height="360" fill="url(#cuadricula)"/>
  <rect width="1200" height="360" fill="url(#brillo)"/>
  <rect width="1200" height="360" fill="url(#brillo2)"/>

  <text x="1170" y="300"
        text-anchor="end"
        class="mono"
        font-size="220"
        font-weight="700"
        fill="url(#acento)"
        opacity=".07">{ }</text>

  <!-- Barra superior -->
  <rect width="1200" height="44"
        fill="#ffffff" fill-opacity=".03"/>

  <circle cx="32" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="22" r="6" fill="#27c93f"/>

  <text x="600" y="27"
        text-anchor="middle"
        class="mono"
        font-size="13"
        fill="#6b7a99">~/desarrollo — terminal</text>

  <!-- Elementos flotantes -->
  <g class="mono" font-size="15" fill="#22d3ee">
    <text class="flotar" x="930" y="100" opacity=".55">
      @AplicacionSpring
    </text>
  </g>

  <g class="mono" font-size="15" fill="#4ade80">
    <text class="flotar2" x="975" y="165" opacity=".5">
      iniciar()
    </text>
  </g>

  <g class="mono" font-size="15" fill="#a78bfa">
    <text class="flotar" x="1010" y="215" opacity=".5">
      SELECT *
    </text>
  </g>

  <g class="mono" font-size="15" fill="#22d3ee">
    <text class="flotar2" x="945" y="318" opacity=".45">
      git subir cambios
    </text>
  </g>

  <!-- Presentación -->
  <g class="mono" font-size="20">
    <text class="aparicion retraso1" x="70" y="108">
      <tspan fill="#4ade80">$</tspan>
      <tspan fill="#9fb0cf"> quién_soy</tspan>
    </text>

    <rect class="cursor"
          x="190" y="92"
          width="11" height="20"
          fill="#4ade80"/>
  </g>

  <text class="aparicion retraso2 sans"
        x="68" y="190"
        font-size="62"
        font-weight="800"
        fill="url(#acento)">
    Alejandro López
  </text>

  <text class="aparicion retraso3 mono"
        x="70" y="235"
        font-size="21"
        fill="#e6edf3">
    <tspan fill="#22d3ee">&lt;</tspan>
    Desarrollador Backend Junior
    <tspan fill="#22d3ee"> /&gt;</tspan>
  </text>

  <text class="aparicion retraso4 mono"
        x="70" y="282"
        font-size="16.5"
        fill="#8b9ab8">
    // Desarrollo de soluciones de software eficientes y seguras,
  </text>

  <text class="aparicion retraso5 mono"
        x="70" y="308"
        font-size="16.5"
        fill="#8b9ab8">
    // con enfoque en programación, bases de datos y automatización.
  </text>

  <!-- Barra inferior -->
  <rect y="352" width="1200" height="8"
        fill="url(#acento)"/>

  <rect class="barrido"
        y="352"
        width="300"
        height="8"
        fill="#fff"
        opacity=".35"/>

</g>

<rect x=".5" y=".5"
      width="1199" height="359"
      rx="18"
      fill="none"
      stroke="#22d3ee"
      stroke-opacity=".25"/>

</svg>
