<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Alejandro López, desarrollador backend junior">
<defs>
<linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#4ade80"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity=".06"/></pattern>
<radialGradient id="gl"><stop stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1200" height="360" rx="18"/></clipPath></defs>
<style>
.m{font-family:Consolas,'Liberation Mono',monospace}.s{font-family:'Segoe UI',Arial,sans-serif}
.f{animation:in .8s ease both}.d1{animation-delay:.3s}.d2{animation-delay:.7s}.d3{animation-delay:1.1s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.b{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-7px)}}
.scan{animation:scan 4s linear infinite}@keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="360" fill="url(#f)"/><rect width="1200" height="360" fill="url(#g)"/><rect width="1200" height="360" fill="url(#gl)"/>
